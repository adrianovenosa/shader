<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design — Painel com seletor de shaders</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; color: #e5e5e5; padding: 32px; }

h2 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 6px; }
p.sub { font-size: 13px; color: #888; margin-bottom: 28px; }

.layout { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }

/* ── Fullscreen mockup ── */
.screen {
  flex: 1; min-width: 320px;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #0d1b4b 0%, #1a0a2e 40%, #0a2e1a 100%);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  border: 1px solid #222;
}
.shader-bg { position: absolute; inset: 0; }
.shader-bg::before, .shader-bg::after {
  content: ''; position: absolute; left: 5%; width: 90%; height: 1px; border-radius: 1px;
}
.shader-bg::before { top: 47%; background: rgba(80,180,255,0.6); box-shadow: 0 0 12px rgba(80,180,255,0.9), 0 0 30px rgba(80,180,255,0.4); }
.shader-bg::after  { top: 53%; background: rgba(60,220,180,0.4); box-shadow: 0 0 8px rgba(60,220,180,0.7); }
.extra { position: absolute; left: 15%; width: 70%; height: 1px; top: 50%; background: rgba(160,100,255,0.3); box-shadow: 0 0 10px rgba(160,100,255,0.5); }

/* gear */
.gear { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(20,20,20,0.75); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #aaa; }

/* ── Panel ── */
.panel {
  width: 220px; flex-shrink: 0;
  background: rgba(14,14,14,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}

.section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,0.25);
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

/* Shader grid */
.shader-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.thumb {
  aspect-ratio: 1; border-radius: 8px; cursor: pointer;
  border: 2px solid transparent;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 4px;
}
.thumb.active { border-color: #3b82f6; }
.thumb-name {
  font-size: 7px; color: rgba(255,255,255,0.7); text-align: center;
  position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  font-weight: 600; letter-spacing: 0.3px;
}

/* Lines thumb */
.thumb-lines {
  background: linear-gradient(160deg, #060d1f 0%, #0d1b3e 100%);
}
.thumb-lines::before { content: ''; position: absolute; left: 10%; width: 80%; height: 1px; top: 38%; background: rgba(80,160,255,0.9); box-shadow: 0 0 6px rgba(80,160,255,1), 0 0 14px rgba(80,160,255,0.5); }
.thumb-lines::after  { content: ''; position: absolute; left: 5%;  width: 90%; height: 1px; top: 48%; background: rgba(50,200,180,0.6); box-shadow: 0 0 5px rgba(50,200,180,0.8); }

/* Waves thumb */
.thumb-waves { background: linear-gradient(160deg, #080f12 0%, #0a1e14 100%); }
.wave-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Perlin thumb */
.thumb-perlin { background: #080608; overflow: hidden; }
.perlin-blob {
  position: absolute;
  border-radius: 50%;
}

/* Fractal thumb */
.thumb-fractal {
  background: radial-gradient(ellipse at 50% 50%, #1a0822 0%, #06020e 70%);
}
.fractal-ring {
  position: absolute; border-radius: 50%; border-style: solid; border-color: transparent;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}

/* Divider */
.divider { height: 1px; background: rgba(255,255,255,0.07); }

/* Slider rows */
.slider-row { display: flex; flex-direction: column; gap: 4px; }
.slider-label { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,0.6); }
.slider-label span { color: rgba(255,255,255,0.25); }
.slider-track { width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.1); position: relative; }
.slider-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.slider-thumb { position: absolute; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid #3b82f6; }

/* hue track */
.hue-track { background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00) !important; }

/* upload */
.upload-btn {
  border: 1px dashed rgba(255,255,255,0.15); border-radius: 8px;
  padding: 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: rgba(255,255,255,0.3); cursor: pointer;
}
.upload-btn span:first-child { font-size: 16px; line-height: 1; }
.upload-btn span:last-child  { font-size: 9px; }
</style>
</head>
<body>
<h2>Design — Painel com seletor de shaders</h2>
<p class="sub">Grid 4×1 no topo do painel — shader ativo tem borda azul. Controles abaixo são os mesmos 5.</p>

<div class="layout">
  <!-- Fullscreen mockup -->
  <div class="screen">
    <div class="shader-bg"></div>
    <div class="extra"></div>
    <div class="gear">⚙</div>
  </div>

  <!-- Panel -->
  <div class="panel">
    <p class="section-label">Shader</p>

    <!-- Thumbnail grid -->
    <div class="shader-grid">

      <!-- Lines (active) -->
      <div class="thumb thumb-lines active">
        <span class="thumb-name">Lines</span>
      </div>

      <!-- Waves -->
      <div class="thumb thumb-waves">
        <svg class="wave-svg" viewBox="0 0 40 40" preserveAspectRatio="none">
          <path d="M0 22 Q10 14 20 22 Q30 30 40 22" fill="none" stroke="rgba(60,220,120,0.8)" stroke-width="1.2" filter="url(#glow)"/>
          <path d="M0 26 Q10 18 20 26 Q30 34 40 26" fill="none" stroke="rgba(40,180,100,0.5)" stroke-width="0.8"/>
          <path d="M0 18 Q10 10 20 18 Q30 26 40 18" fill="none" stroke="rgba(80,255,150,0.4)" stroke-width="0.6"/>
          <defs>
            <filter id="glow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
        </svg>
        <span class="thumb-name">Waves</span>
      </div>

      <!-- Perlin -->
      <div class="thumb thumb-perlin">
        <div class="perlin-blob" style="width:28px;height:28px;top:2px;left:2px;background:radial-gradient(circle,rgba(160,80,255,0.35),transparent 70%)"></div>
        <div class="perlin-blob" style="width:22px;height:22px;top:10px;left:12px;background:radial-gradient(circle,rgba(80,160,255,0.3),transparent 70%)"></div>
        <div class="perlin-blob" style="width:18px;height:18px;top:4px;left:16px;background:radial-gradient(circle,rgba(255,80,160,0.25),transparent 70%)"></div>
        <div class="perlin-blob" style="width:14px;height:14px;top:16px;left:4px;background:radial-gradient(circle,rgba(80,255,200,0.25),transparent 70%)"></div>
        <span class="thumb-name" style="position:relative;z-index:1">Perlin</span>
      </div>

      <!-- Fractal -->
      <div class="thumb thumb-fractal">
        <div class="fractal-ring" style="width:28px;height:28px;border-width:1px;border-top-color:rgba(255,100,200,0.6);border-right-color:rgba(255,100,200,0.3)"></div>
        <div class="fractal-ring" style="width:18px;height:18px;border-width:1px;border-bottom-color:rgba(200,100,255,0.5);border-left-color:rgba(200,100,255,0.2)"></div>
        <div class="fractal-ring" style="width:8px;height:8px;border-width:1px;border-color:rgba(255,150,220,0.5)"></div>
        <span class="thumb-name">Fractal</span>
      </div>
    </div>

    <div class="divider"></div>
    <p class="section-label">Controles</p>

    <!-- Sliders -->
    <div class="slider-row">
      <div class="slider-label">Velocidade <span>0.050</span></div>
      <div class="slider-track"><div class="slider-fill" style="width:35%"></div><div class="slider-thumb" style="left:calc(35% - 5px)"></div></div>
    </div>
    <div class="slider-row">
      <div class="slider-label">Espessura <span>0.0008</span></div>
      <div class="slider-track"><div class="slider-fill" style="width:25%"></div><div class="slider-thumb" style="left:calc(25% - 5px)"></div></div>
    </div>
    <div class="slider-row">
      <div class="slider-label">Pixelação <span>4.0</span></div>
      <div class="slider-track"><div class="slider-fill" style="width:20%"></div><div class="slider-thumb" style="left:calc(20% - 5px)"></div></div>
    </div>
    <div class="slider-row">
      <div class="slider-label">Linhas <span>5</span></div>
      <div class="slider-track"><div class="slider-fill" style="width:50%"></div><div class="slider-thumb" style="left:calc(50% - 5px)"></div></div>
    </div>
    <div class="slider-row">
      <div class="slider-label">Cor <span>0°</span></div>
      <div class="slider-track hue-track"><div class="slider-thumb" style="left:0px;background:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,0.5)"></div></div>
    </div>

    <div class="divider"></div>

    <div class="upload-btn">
      <span>🖼</span>
      <span>Carregar PNG</span>
    </div>
  </div>
</div>
</body>
</html>
